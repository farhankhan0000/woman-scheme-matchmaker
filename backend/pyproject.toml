[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "google-genai>=3.2.0",
    "groq>=1.7.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
